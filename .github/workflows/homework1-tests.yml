name: Homework 1 Compile, Test and Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homework1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compile C++17 with warnings as errors
        run: g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror homework1/src/main.cpp -o homework1-bin
      - name: Run 66 functional and boundary tests
        run: python3 homework1/tests/test_homework.py ./homework1-bin
      - name: Run the teacher's original report validator
        run: |
          chmod +x .github/scripts/validator_linux
          ./.github/scripts/validator_linux
